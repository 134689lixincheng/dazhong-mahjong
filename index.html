<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="screen-orientation" content="landscape" />
  <title>大众麻将 · 异地对局</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <section id="lobby" class="lobby">
      <div class="lobby-bg" aria-hidden="true"></div>
      <div class="lobby-card">
        <p class="brand">大众麻将</p>
        <h1 class="lobby-title">异地对局</h1>
        <p class="lobby-desc">拟真牌面 · 横屏四向牌桌 · 单人 / 双人联机</p>

        <label class="nick-field">昵称 <input id="nick" maxlength="8" value="玩家" /></label>

        <div class="mode-grid">
          <button type="button" class="mode-btn selected" data-mode="solo">
            <span class="mode-name">单人 vs 电脑</span>
            <span class="mode-hint">本机开局，三名 AI</span>
          </button>
          <button type="button" class="mode-btn" data-mode="duo">
            <span class="mode-name">双人异地组队</span>
            <span class="mode-hint">填加速节点可降延迟 · 两名 AI</span>
          </button>
        </div>

        <div id="duo-panel" class="duo-panel hidden">
          <label class="nick-field ws-field">
            加速节点（可选）
            <input id="ws-url" type="url" placeholder="wss://你的香港或国内域名" autocomplete="off" />
          </label>
          <p class="ws-hint">有香港/国内服务器时填入，双方用同一地址；留空则用点对点（国外信令，可能较慢）</p>
          <button type="button" id="btn-save-ws" class="btn-ghost" style="width:100%;margin-bottom:0.75rem">保存节点</button>
          <button type="button" id="btn-create" class="btn-primary">创建房间</button>
          <div class="or-line">或加入好友房间</div>
          <div class="join-row">
            <input id="room-code" maxlength="5" placeholder="房间码" autocomplete="off" />
            <button type="button" id="btn-join" class="btn-ghost">加入</button>
          </div>
        </div>

        <button type="button" id="btn-start-solo" class="btn-primary">开桌</button>
        <p id="lobby-err" class="lobby-err"></p>
      </div>
    </section>

    <!-- 等待室 -->
    <section id="waiting" class="lobby hidden">
      <div class="lobby-bg" aria-hidden="true"></div>
      <div class="lobby-card">
        <p class="brand">房间 <span id="wait-code"></span></p>
        <p class="lobby-desc">把房间码发给队友；若填写了加速节点，请确保双方节点地址相同</p>
        <ul id="wait-list" class="wait-list"></ul>
        <button type="button" id="btn-ready" class="btn-primary">准备</button>
        <button type="button" id="btn-copy" class="btn-ghost" style="width:100%;margin-top:0.5rem">复制房间码</button>
        <button type="button" id="btn-leave-wait" class="btn-ghost" style="width:100%;margin-top:0.5rem">离开</button>
      </div>
    </section>

    <section id="table" class="table hidden">
      <div class="rotate-hint" aria-hidden="true">
        <p>请横屏游玩</p>
        <span>旋转设备以获得最佳牌桌体验</span>
      </div>
      <header class="topbar">
        <div class="brand-mini">大众麻将</div>
        <div class="meta">
          <span id="meta-mode"></span>
          <span id="meta-round"></span>
          <span id="meta-wall"></span>
          <span id="meta-room"></span>
        </div>
        <button type="button" id="btn-lobby" class="btn-ghost">离开</button>
      </header>

      <div class="felt">
        <div class="table-compass">
          <div class="seat seat-top" data-screen="2">
            <div class="seat-info"><span class="seat-name"></span><span class="seat-score"></span><span class="seat-tag"></span></div>
            <div class="tile-stack">
              <div class="hand-row"></div>
              <div class="meld-row"></div>
              <div class="discard-row"></div>
            </div>
          </div>

          <div class="seat seat-left" data-screen="3">
            <div class="seat-info"><span class="seat-name"></span><span class="seat-score"></span><span class="seat-tag"></span></div>
            <div class="tile-stack">
              <div class="hand-row"></div>
              <div class="meld-row"></div>
              <div class="discard-row"></div>
            </div>
          </div>

          <div class="center-board">
            <div id="status-msg" class="status-msg"></div>
            <div id="last-discard" class="last-discard"></div>
            <div id="team-banner" class="team-banner hidden"></div>
            <div id="claim-bar" class="claim-bar hidden"></div>
          </div>

          <div class="seat seat-right" data-screen="1">
            <div class="seat-info"><span class="seat-name"></span><span class="seat-score"></span><span class="seat-tag"></span></div>
            <div class="tile-stack">
              <div class="hand-row"></div>
              <div class="meld-row"></div>
              <div class="discard-row"></div>
            </div>
          </div>

          <div class="seat seat-bottom" data-screen="0">
            <div class="tile-stack">
              <div class="discard-row"></div>
              <div class="meld-row"></div>
              <div class="hand-row self" id="hand-bottom"></div>
            </div>
            <div class="seat-info bottom-info">
              <span class="seat-name"></span>
              <span class="seat-score"></span>
              <span class="seat-tag"></span>
              <div id="turn-actions" class="turn-actions"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div id="result-modal" class="modal hidden">
      <div class="modal-card">
        <h2 id="result-title"></h2>
        <p id="result-detail"></p>
        <ul id="result-scores"></ul>
        <div class="modal-actions">
          <button type="button" id="btn-next" class="btn-primary">下一局</button>
          <button type="button" id="btn-result-lobby" class="btn-ghost">回大厅</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
