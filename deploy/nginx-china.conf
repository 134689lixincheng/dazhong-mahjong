# 香港 / 国内 VPS 反代示例（Nginx）
# 静态走 Vercel，联机 WebSocket 走本机 Node（npm start）
#
# 用法：
# 1. 本机：PORT=5173 npm start
# 2. 证书用 certbot；把 your.domain 换成你的域名
# 3. 玩家在大厅「加速节点」填：wss://your.domain
#    或打开 https://dazhong-mahjong.vercel.app/?ws=wss://your.domain

upstream mahjong_ws {
    server 127.0.0.1:5173;
}

server {
    listen 443 ssl http2;
    server_name your.domain;

    ssl_certificate     /etc/letsencrypt/live/your.domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain/privkey.pem;

    # 可选：整站也反代到本机（延迟最低）
    # location / {
    #     proxy_pass http://127.0.0.1:5173;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # 仅反代 WebSocket（前端仍用 Vercel）
    location / {
        proxy_pass http://mahjong_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
