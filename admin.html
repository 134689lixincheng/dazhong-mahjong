<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>后台管理 · 大众麻将</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <section class="lobby admin-page">
    <div class="lobby-bg" aria-hidden="true"></div>
    <div class="lobby-card admin-card">
      <p class="brand">后台管理</p>
      <h1 class="lobby-title">人机配置</h1>
      <p class="admin-sub">单独访问本页即可调整人机昏棋率</p>

      <div id="admin-gate" class="admin-gate">
        <label>管理密码 <input id="admin-pin" type="password" maxlength="12" placeholder="默认 8888" autocomplete="current-password" /></label>
        <p id="admin-err" class="lobby-err"></p>
        <button type="button" id="btn-admin-login" class="btn-primary">进入</button>
      </div>

      <div id="admin-body" class="admin-body hidden">
        <div class="preset-row" id="preset-row"></div>
        <label class="slider-field">
          <span>昏棋率 <strong id="blunder-label">12%</strong></span>
          <input id="blunder-range" type="range" min="0" max="100" step="1" value="12" />
        </label>
        <p class="admin-tip">0% = 最强理性 · 40%+ = 经常打错牌 / 漏碰漏胡。保存后对新开对局生效。</p>
        <label class="nick-field">修改密码 <input id="admin-pin-new" type="password" maxlength="12" placeholder="可选" autocomplete="new-password" /></label>
        <p id="admin-ok" class="ai-level-hint"></p>
        <button type="button" id="btn-admin-save" class="btn-primary">保存配置</button>
      </div>

      <a class="btn-ghost admin-back" href="./">返回游戏</a>
    </div>
  </section>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
